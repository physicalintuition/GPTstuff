name: Research Radar auto-publish

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Vienna'
    - cron: '27 8 * * 1'
      timezone: 'Europe/Vienna'
  workflow_dispatch:
    inputs:
      feed:
        description: 'Feed to update'
        type: choice
        required: true
        default: papers
        options: [papers, opportunities, both]

permissions:
  contents: write

concurrency:
  group: research-radar-publishing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'openai>=2.0,<3' 'requests>=2.32,<3'
      - name: Check secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure OPENAI_API_KEY as a repository Actions secret."
            exit 1
          fi
      - name: Scan and update reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FEED: ${{ inputs.feed }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$FEED" in
              papers) python research-radar/scripts/update_feeds.py papers ;;
              opportunities) python research-radar/scripts/update_feeds.py opportunities ;;
              both)
                python research-radar/scripts/update_feeds.py papers
                python research-radar/scripts/update_feeds.py opportunities
                ;;
            esac
          elif [ "$SCHEDULE" = "17 8 * * *" ]; then
            python research-radar/scripts/update_feeds.py papers
          else
            python research-radar/scripts/update_feeds.py opportunities
          fi
      - name: Commit new results
        run: |
          git add research-radar/data/papers.json research-radar/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No sufficiently relevant changes to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Research Radar: publish selected updates"
          git push
